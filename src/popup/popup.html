<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Translator</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --text: #e0e0e0;
      --muted: #a0a0b0;
      --accent: #e94560;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      min-height: 180px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 0.85rem;
    }
    h1 { font-size: 1rem; margin-bottom: 14px; color: var(--accent); }
    p { color: var(--muted); margin-bottom: 14px; line-height: 1.4; }

    button {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 8px;
    }
    button:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .settings-link {
      display: block;
      text-align: center;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .settings-link a { color: var(--accent); }

    #status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .toggles {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .toggle-item input[type="checkbox"] {
      appearance: none;
      width: 32px;
      height: 18px;
      background: #555;
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-item input[type="checkbox"]::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-item input[type="checkbox"]:checked {
      background: var(--accent);
    }
    .toggle-item input[type="checkbox"]:checked::after {
      transform: translateX(14px);
    }
    .toggle-item label {
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text);
      user-select: none;
    }
  </style>
</head>
<body>
  <h1>🎬 Subtitle Translator</h1>

  <div class="toggles">
    <div class="toggle-item">
      <input type="checkbox" id="toggleGerman" checked>
      <label for="toggleGerman">🇩🇪 Original</label>
    </div>
    <div class="toggle-item">
      <input type="checkbox" id="toggleEnglish" checked>
      <label for="toggleEnglish">🇬🇧 English</label>
    </div>
  </div>

  <div id="actions"></div>

  <div class="settings-link">
    <a href="#" id="settingsLink">⚙️ Settings (API key)</a>
  </div>

  <div id="status"></div>

  <script src="../storage/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
