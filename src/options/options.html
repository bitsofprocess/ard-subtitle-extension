<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Translator — Options</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --text: #e0e0e0;
      --muted: #a0a0b0;
      --accent: #e94560;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 24px;
      color: var(--accent);
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin: -8px 0 16px 0;
      line-height: 1.4;
    }
    .hint a { color: var(--accent); }
    button {
      padding: 10px 24px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #status {
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .ok { color: var(--success); }
    .err { color: var(--accent); }
    .section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .section h2 {
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .stored-list {
      list-style: none;
      font-size: 0.8rem;
    }
    .stored-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .stored-list .url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 8px;
      color: var(--muted);
    }
    .stored-list .del-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 8px;
    }
  </style>
</head>
<body>
  <h1>⚙️ Subtitle Translator Settings</h1>

  <label for="apiKey">OpenRouter API Key</label>
  <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off">
  <p class="hint">
    Get your key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>.
    Stored locally in your browser, never sent anywhere else.
  </p>
  <button id="saveBtn">Save</button>
  <p id="status"></p>

  <div class="section">
    <h2>📦 Stored Subtitle Data</h2>
    <ul class="stored-list" id="storedList"></ul>
    <p id="emptyMsg" style="font-size:0.8rem; color:var(--muted);">No subtitle data yet. Import a file via the extension popup.</p>
  </div>

  <script src="../storage/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
